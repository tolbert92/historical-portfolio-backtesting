name: Historical Backtesting Contract Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install 'jsonschema>=4.20,<5'
      - name: Run contract and fixture tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee test-results.log
          grep -Eq 'Ran [1-9][0-9]* tests?' test-results.log
          grep -Eq '^OK$' test-results.log
